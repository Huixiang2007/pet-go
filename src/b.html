<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>邮箱验证码 - PetGo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #333;
        background-color: #f9f5f0;
      }

      .email-container {
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .email-header {
        background: linear-gradient(135deg, #ff9e80 0%, #ffab91 100%);
        padding: 40px 30px;
        text-align: center;
        color: white;
        position: relative;
        overflow: hidden;
      }

      .header-paw {
        position: absolute;
        opacity: 0.1;
        font-size: 120px;
      }

      .header-paw-1 {
        top: 20px;
        left: 20px;
      }

      .header-paw-2 {
        bottom: 20px;
        right: 20px;
      }

      .logo {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #e87722;
      }
      .logo-img {
        width: 100px;
      }
      .logo i {
        font-size: 36px;
      }

      .header-title {
        font-size: 24px;
        margin-bottom: 8px;
        font-weight: 600;
      }

      .header-subtitle {
        font-size: 16px;
        opacity: 0.9;
      }

      .email-content {
        padding: 40px 30px;
      }

      .greeting {
        font-size: 18px;
        margin-bottom: 25px;
        color: #5d4037;
      }

      .verification-section {
        text-align: center;
        margin: 30px 0;
      }

      .verification-code {
        background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
        border: 2px dashed #ffb74d;
        border-radius: 15px;
        padding: 25px;
        margin: 25px 0;
      }

      .code {
        font-size: 42px;
        font-weight: bold;
        letter-spacing: 8px;
        color: #ff6f00;
        text-align: center;
        font-family: 'Courier New', monospace;
        background: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(255, 111, 0, 0.2);
      }

      .expiry-info {
        color: #666;
        font-size: 14px;
        margin-top: 15px;
      }

      .warning-text {
        background: #fff3e0;
        border-left: 4px solid #ffb74d;
        padding: 15px;
        margin: 25px 0;
        border-radius: 8px;
        font-size: 14px;
      }

      .steps {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 25px;
        margin: 25px 0;
      }

      .step {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        padding: 12px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      .step:last-child {
        margin-bottom: 0;
      }

      .step-number {
        width: 30px;
        height: 30px;
        background: linear-gradient(135deg, #80cbc4 0%, #a5d6a7 100%);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        margin-right: 15px;
        flex-shrink: 0;
      }
      /* 响应式设计 */
      @media (max-width: 600px) {
        .email-content {
          padding: 30px 20px;
        }

        .email-header {
          padding: 30px 20px;
        }

        .code {
          font-size: 32px;
          letter-spacing: 6px;
        }

        .footer-links {
          flex-direction: column;
          gap: 10px;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animated {
        animation: fadeIn 0.6s ease-out;
      }
      .slogan {
        text-align: center;
        color: grey;
      }
      @media print {
        .email-container {
          box-shadow: none;
          border: 1px solid #ddd;
        }
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <!-- 邮件头部 -->
      <div class="email-header">
        <i class="fas fa-paw header-paw header-paw-1"></i>
        <i class="fas fa-paw header-paw header-paw-2"></i>
        <img src="./B952AA4D73DB085341867740E166E089.png" class="logo-img" />
        <span class="logo">PetGo</span>
        <h1 class="header-title">邮箱验证码</h1>
        <p class="header-subtitle">请使用以下验证码完成操作</p>
      </div>

      <!-- 邮件内容 -->
      <div class="email-content">
        <div class="greeting animated">
          <p>亲爱的 <strong>用户</strong>,</p>
          <p>您正在宠物温馨家园平台进行重要操作，请使用以下验证码完成验证：</p>
        </div>

        <div class="verification-section animated">
          <div class="verification-code">
            <div class="code" id="verificationCode">111</div>
            <p class="expiry-info">此验证码 <strong>5分钟</strong> 内有效，请尽快使用</p>
          </div>
        </div>

        <div class="warning-text animated">
          <p><strong>安全提示：</strong></p>
          <p>• 请勿将验证码透露给任何人，包括平台客服</p>
          <p>• 平台工作人员不会向您索要验证码</p>
          <p>• 如非本人操作，请立即忽略此邮件</p>
        </div>
        <p class="slogan">宠有所依，让爱不缺席~</p>
      </div>
    </div>

    <!-- Font Awesome 图标 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </body>
</html>
