<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>碎片化轮播图</title>
    <style>
      :root {
        --primary: #4c6ef5;
        --secondary: #339af0;
        --dark: #1a1a2e;
        --light: #f8f9fa;
        --image-width: 60%;
        --image-height: 60%;
      }

      /* 基础样式 */
      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        overflow: hidden;
        background-color: var(--dark);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .container {
        width: var(--image-width);
        height: var(--image-height);
      }

      /* 轮播图容器 */
      .carousel-container {
        position: relative;
        border-radius: 0.75rem;
        overflow: hidden;
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
      }

      /* 轮播图片区域 */
      .carousel {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
      }

      /* 轮播图 */
      .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 300ms;
      }

      .slide.active {
        opacity: 1;
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 3rem;
        height: 3rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(4px);
        border-radius: 50%;
        color: white;
        transition: all 300ms;
        cursor: pointer;
        border: none;
        outline: none;
        z-index: 10;
        font-size: 1.5rem;
        font-weight: bold;
      }

      .nav-btn:hover {
        background: rgba(76, 110, 245, 0.8);
        transform: translateY(-50%) scale(1.1);
      }

      .nav-btn.prev {
        left: 1rem;
      }

      .nav-btn.next {
        right: 1rem;
      }

      /* 指示器 */
      .indicators {
        position: absolute;
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 0.5rem;
        z-index: 10;
      }

      .dot {
        width: 0.75rem;
        height: 0.75rem;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.8);
        transition: all 300ms;
        cursor: pointer;
        border: none;
        outline: none;
      }

      .dot.active {
        width: 2rem;
        border-radius: 0.375rem;
        background: #4c6ef5;
      }

      /* 碎片 */
      .fragment {
        position: absolute;
        pointer-events: none;
        transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        z-index: 5; /* 确保碎片在原图片之上 */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 轮播图容器 -->
      <div class="carousel-container" id="carousel-container">
        <!-- 轮播图片区域 -->
        <div class="carousel" id="carousel">
          <!-- 轮播图片通过JS动态添加 -->
        </div>
        <!-- 导航按钮 -->
        <button class="nav-btn prev" id="prev-btn">
          <span>‹</span>
        </button>
        <button class="nav-btn next" id="next-btn">
          <span>›</span>
        </button>
        <!-- 指示器 -->
        <div class="indicators" id="indicators">
          <!-- 指示器通过JS动态添加 -->
        </div>
      </div>
    </div>
    <script>
      const carouselConfig = {
        images: [
          {
            src: 'https://picsum.photos/800/450?random=1',
            alt: '图片一',
          },
          {
            src: 'https://picsum.photos/800/450?random=2',
            alt: '图片二',
          },
          {
            src: 'https://picsum.photos/800/450?random=3',
            alt: '图片三',
          },
          {
            src: 'https://picsum.photos/800/450?random=4',
            alt: '图片四',
          },
          {
            src: 'https://picsum.photos/800/450?random=5',
            alt: '图片五',
          },
        ],
        fragmentConfig: {
          rows: 10, // 碎片行数
          cols: 15, // 碎片列数
          maxDisplacement: 100, // 碎片最大位移距离
          maxRotation: 180, // 碎片最大旋转角度
          minScale: 0.2, // 碎片最小缩放比例
        },
        autoplay: true, // 是否自动播放
        autoplaySpeed: 3000, // 自动播放速度（毫秒）
        transitionDuration: 1000, // 过渡动画持续时间
      }

      // DOM元素
      const carouselContainer = document.getElementById('carousel')
      const prevBtn = document.getElementById('prev-btn')
      const nextBtn = document.getElementById('next-btn')
      const indicators = document.getElementById('indicators')

      // 状态变量
      let currentSlide = 0
      let autoplayInterval
      let isPlaying = carouselConfig.autoplay
      let autoplaySpeed = carouselConfig.autoplaySpeed
      let isTransitioning = false // 过渡状态锁

      // 初始化轮播图
      function initCarousel() {
        // 创建轮播图片
        carouselConfig.images.forEach((image, index) => {
          const slide = document.createElement('div')
          slide.className = `slide ${index === 0 ? 'active' : ''}`
          slide.dataset.index = index

          const img = document.createElement('img')
          img.src = image.src
          img.alt = image.alt
          slide.appendChild(img)
          carouselContainer.appendChild(slide)

          // 创建指示器
          const dot = document.createElement('button')
          dot.className = `dot ${index === 0 ? 'active' : ''}`
          dot.dataset.index = index
          dot.addEventListener('click', () => goToSlide(index))
          indicators.appendChild(dot)
        })

        // 设置自动播放
        if (isPlaying) {
          startAutoplay()
        }

        // 绑定事件
        prevBtn.addEventListener('click', () => {
          if (!isTransitioning) goToPrevSlide()
        })

        nextBtn.addEventListener('click', () => {
          if (!isTransitioning) goToNextSlide()
        })
      }

      // 切换到指定轮播图
      function goToSlide(index) {
        if (index === currentSlide || isTransitioning) return

        isTransitioning = true // 锁定过渡状态

        const slides = document.querySelectorAll('.slide')
        const currentSlideEl = slides[currentSlide]
        const newSlideEl = slides[index]

        // 更新指示器
        document.querySelectorAll('.dot').forEach((dot, i) => {
          dot.classList.toggle('active', i === index)
        })

        // 立即隐藏当前图片，显示新图片
        currentSlideEl.classList.remove('active')
        newSlideEl.classList.add('active')
        currentSlide = index

        // 对刚刚隐藏的图片进行碎片化动画
        fragmentImage(currentSlideEl.querySelector('img'), () => {
          // 动画完成后的回调
          // 重置自动播放计时器
          if (isPlaying) {
            resetAutoplay()
          }

          // 解除锁定
          isTransitioning = false
        })
      }

      // 切换到上一张
      function goToPrevSlide() {
        const newIndex =
          (currentSlide - 1 + carouselConfig.images.length) % carouselConfig.images.length
        goToSlide(newIndex)
      }

      // 切换到下一张
      function goToNextSlide() {
        const newIndex = (currentSlide + 1) % carouselConfig.images.length
        goToSlide(newIndex)
      }

      // 图片碎片化函数
      function fragmentImage(img, callback) {
        if (!img.complete) {
          if (callback) callback()
          return
        }

        // 移除之前的碎片
        const existingFragments = carouselContainer.querySelectorAll('.fragment')
        existingFragments.forEach((frag) => frag.remove())

        // 获取图片尺寸和容器尺寸
        const imgWidth = img.naturalWidth
        const imgHeight = img.naturalHeight
        const containerWidth = carouselContainer.offsetWidth
        const containerHeight = carouselContainer.offsetHeight

        // 计算容器和图片的宽高比
        const containerRatio = containerWidth / containerHeight
        const imgRatio = imgWidth / imgHeight

        // 计算实际显示的图片尺寸(考虑object-cover的影响)
        let displayWidth, displayHeight
        if (imgRatio > containerRatio) {
          // 图片比容器宽，高度填满容器，宽度超出
          displayHeight = containerHeight
          displayWidth = displayHeight * imgRatio
        } else {
          // 图片比容器高，宽度填满容器，高度超出
          displayWidth = containerWidth
          displayHeight = displayWidth / imgRatio
        }

        // 计算图片在容器中的偏移(居中显示)
        const offsetX = (displayWidth - containerWidth) / 2
        const offsetY = (displayHeight - containerHeight) / 2

        // 设置碎片参数
        const { rows, cols, maxDisplacement, maxRotation, minScale } = carouselConfig.fragmentConfig
        const fragmentWidth = displayWidth / cols
        const fragmentHeight = displayHeight / rows

        // 创建碎片 - 这些碎片将替代原图片显示
        for (let i = 0; i < rows; i++) {
          for (let j = 0; j < cols; j++) {
            const fragment = document.createElement('div')
            fragment.className = 'fragment'

            // 设置碎片的位置和大小
            fragment.style.left = `${j * fragmentWidth - offsetX}px`
            fragment.style.top = `${i * fragmentHeight - offsetY}px`
            fragment.style.width = `${fragmentWidth}px`
            fragment.style.height = `${fragmentHeight}px`

            // 使用背景图定位来显示原图的相应部分
            fragment.style.backgroundImage = `url(${img.src})`
            fragment.style.backgroundSize = `${displayWidth}px ${displayHeight}px`
            fragment.style.backgroundPosition = `-${j * fragmentWidth}px -${i * fragmentHeight}px`

            // 设置初始样式 - 碎片开始时完全可见
            fragment.style.opacity = '1'
            fragment.style.transform = 'translate(0,0) rotate(0) scale(1)'

            // 添加到容器
            carouselContainer.appendChild(fragment)

            // 延迟启动每个碎片的动画，创建错开效果
            setTimeout(
              () => {
                // 计算随机位移、旋转和不透明度
                const randomX = (Math.random() - 0.5) * maxDisplacement
                const randomY = (Math.random() - 0.5) * maxDisplacement
                const randomRotation = (Math.random() - 0.5) * maxRotation
                const randomScale = minScale + Math.random() * (1 - minScale)

                // 应用碎片动画 - 碎片会飞散并消失
                fragment.style.transform = `translate(${randomX}px,${randomY}px) rotate(${randomRotation}deg) scale(${randomScale})`
                fragment.style.opacity = '0'
              },
              (i * cols + j) * 10,
            ) // 每个碎片有10ms的延迟，创建波浪效果
          }
        }

        // 动画结束后移除碎片并执行回调
        const totalDuration = carouselConfig.transitionDuration + rows * cols * 10
        setTimeout(() => {
          const fragments = carouselContainer.querySelectorAll('.fragment')
          fragments.forEach((frag) => frag.remove())
          if (callback) callback()
        }, totalDuration)
      }

      // 开始自动播放
      function startAutoplay() {
        autoplayInterval = setInterval(() => {
          if (!isTransitioning) goToNextSlide()
        }, autoplaySpeed)
      }

      // 停止自动播放
      function stopAutoplay() {
        clearInterval(autoplayInterval)
      }

      // 重置自动播放计时器
      function resetAutoplay() {
        if (isPlaying) {
          clearInterval(autoplayInterval)
          startAutoplay()
        }
      }

      // 初始化
      initCarousel()
    </script>
  </body>
</html>
